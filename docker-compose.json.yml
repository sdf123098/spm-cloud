services:
  spm-cloud:
    image: ${SPM_CLOUD_IMAGE:-spm-cloud:local}
    build: .
    restart: unless-stopped
    command: ["--config", "/etc/spm-cloud/config.json"]
    environment:
      SPM_CLOUD_TRUSTED_PROXY_IPS: ${SPM_CLOUD_PROXY_IP:-172.30.10.3}
    volumes:
      - spm-cloud-data:/var/lib/spm-cloud/data
      - spm-cloud-objects:/var/lib/spm-cloud/objects
      - ${SPM_CLOUD_CONFIG_DIR:-./deploy/runtime}:/etc/spm-cloud:ro
      - ${SPM_CLOUD_SECRETS_DIR:-./deploy/runtime/secrets}:/etc/spm-cloud/secrets:ro
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SPM_CLOUD_HOST: ${SPM_CLOUD_HOST:-cloud.example.com}
    networks:
      default:
        ipv4_address: ${SPM_CLOUD_PROXY_IP:-172.30.10.3}
    depends_on:
      - spm-cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  spm-cloud-data:
    name: ${SPM_CLOUD_DATA_VOLUME:-spm-cloud-data}
  spm-cloud-objects:
    name: ${SPM_CLOUD_OBJECTS_VOLUME:-spm-cloud-objects}
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: ${SPM_CLOUD_NETWORK_SUBNET:-172.30.10.0/24}
